<div class="plan">

  <div class="plan__header">
    <h1 class="plan__title">Plan &amp; stages</h1>
  </div>

  <app-lifecycle-stepper
    [steps]="lifecycleSteps"
    [activeIndex]="activeStepIndex()"
  />

  <!-- Work Breakdown Structure -->
  <div class="plan__card plan__card--wbs">
    <div class="plan__card-header">
      <h3 class="plan__card-title">Work breakdown structure</h3>
    </div>
    @if (project(); as p) {
      <app-wbs-tree [projectId]="p.id" />
    } @else {
      <app-empty-state
        icon="account_tree"
        title="No project selected"
        message="Select a project to view its work breakdown structure."
      />
    }
  </div>

  <!-- Stage tolerances -->
  @if (project(); as p) {
    <div class="plan__card">
      <h3 class="plan__card-title">Stage tolerances</h3>
      <div class="plan__tolerances">
        <div class="plan__tolerance-row">
          <span class="plan__tolerance-label">Time</span>
          <div class="plan__tolerance-bar-wrap">
            <div class="plan__tolerance-bar">
              <div class="plan__tolerance-fill plan__tolerance-fill--ok" style="width: 60%"></div>
            </div>
            <span class="plan__tolerance-range">
              {{ p.tolerances.time.min ?? '—' }} / {{ p.tolerances.time.max ?? '—' }} days
            </span>
          </div>
        </div>
        <div class="plan__tolerance-row">
          <span class="plan__tolerance-label">Cost</span>
          <div class="plan__tolerance-bar-wrap">
            <div class="plan__tolerance-bar">
              <div class="plan__tolerance-fill plan__tolerance-fill--warn" style="width: 82%"></div>
            </div>
            <span class="plan__tolerance-range">
              {{ p.tolerances.cost.min ?? '—' }} / {{ p.tolerances.cost.max ?? '—' }} €
            </span>
          </div>
        </div>
      </div>
    </div>
  }

</div>
