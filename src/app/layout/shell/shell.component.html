<app-loading-bar />

<div
  class="shell"
  [class.shell--sidebar-collapsed]="layout.sidebarCollapsed()"
  [class.shell--ai-open]="shell.aiDockOpen()"
>
  <div class="shell__sidebar">
    <app-sidebar />
  </div>

  <div class="shell__body">
    <app-top-bar />

    <main class="shell__content" id="main-content">
      <div class="shell__content-inner">
        <router-outlet />
      </div>
    </main>
  </div>

  @if (shell.aiDockOpen()) {
    <div class="shell__ai-dock">
      <app-ai-dock />
    </div>
  }
</div>

@if (shell.paletteOpen()) {
  <app-command-palette />
}

@if (shell.switcherOpen()) {
  <app-project-switcher />
}
