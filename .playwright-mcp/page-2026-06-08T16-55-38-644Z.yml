                - paragraph [ref=e296]:
                  - text: "Iz 2-3 ur na manj kot 30 minut. Toliko se je skrajšal čas priprave poslovne ponudbe po uvedbi internega AI agenta. V našem podjetju smo pred kratkim postavili AI agenta, ki je zaposlenim dostopen prek Microsoft Teamsov. Sedaj v manj kot 30 minutah opravimo proces, ki je prej trajal 2-3 ure: → Uporabnik vnese osnovne podatke o stranki. → Agent prebere spletno stran stranke. → Iz internega kataloga storitev sestavi personaliziran osnutek 9 poglavij ponudbe. → Operater popravi ali potrdi poglavja (lahko zahteva tudi regeneracijo z AI). → Agent vse poveže v Word dokument, ki gre direktno stranki. 📊 Številke v kontekstu: → Pri 5 ponudbah tedensko: prihranek 10-12 ur dela. → Vse ponudbe imajo enako kakovost (ni odvisna od pripravljavca). → Svetovalci preživijo več časa pri strankah, manj v Word-u. Glavno vprašanje pri uvajanju AI ni \"katero orodje izbrati\", temveč \"kje v naši organizaciji AI dejansko ustvari poslovno vrednost\". Na to vprašanje odgovarjamo strukturirano: 🔹 Izhajamo iz dejanskih poslovnih izzivov in obstoječih procesov, ne iz orodij. 🔹 Identificiramo primere uporabe z merljivim učinkom in jih ločujemo od idej, ki niso primerne za izvedbo. 🔹 Svetujemo glede pristopa in tehnologije, ki je primerna za vašo organizacijo. Trije vpogledi: 1️⃣ Umetne inteligence ne uvajamo, da bi nadomestili ljudi. Uvajamo jo, da bi ljudje delali tisto, kar prinaša največjo vrednost. 2️⃣ Najboljši AI projekti niso \"kupimo novo orodje\". Začnejo se z vprašanjem, kje točno izgubljamo čas. 3️⃣ Hitre zmage z realnim učinkom premagajo dolgoročne načrte z nedoločenim ROI. Kdo pri vas pripravlja ponudbe? Bi to lahko bil naslednji proces, ki ga uredite?"
