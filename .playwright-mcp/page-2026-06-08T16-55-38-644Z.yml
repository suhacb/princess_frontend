          - generic [ref=e84]:
            - paragraph [ref=e85]: "Sinecon is a team of leading IT professionals who understand their clients and connect them in the digitalisation process with reliable suppliers of digital products and projects. We help you select the best digital solutions and suppliers, optimise purchasing costs and successfully execute digital projects. Our main focus service areas are: 1. Introduction of real IT and digital solutions 2. Project management and consulting 3. Sales If the answer to the questions below is one yes, then we are the right partner for you. 1. You are aware that you are not achieving the desired business goals with your current software, but you do not know what digitalisation can bring you and how you can select the most suitable digital products for you and also implement them successfully? 2. You want to tackle a challenging IT project, but you don't have enough experience and knowledge to bring the project to a successful conclusion within the agreed deadlines and budget? 3. You have technologically advanced IT solutions, but your sales activities are not producing the desired results because you do not have access to key potential customers, you have not designed the product properly or you need help closing the deal?"
