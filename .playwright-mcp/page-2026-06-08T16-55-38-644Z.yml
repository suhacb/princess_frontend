                  - paragraph [ref=e420]:
                    - text: "Kako se začne dober petek? ☕️ S kavo, rogljičkom in jasnimi smernicami za krepitev kibernetske odpornosti. Danes pri nas poteka že drugi 𝐬𝐞𝐦𝐢𝐧𝐚𝐫 𝐒𝐤𝐥𝐚𝐝𝐧𝐨𝐬𝐭 𝐳 𝐙𝐈𝐧𝐟𝐕-1, kjer podjetjem pomagamo graditi trdne temelje za odpornost, skladnost in varno digitalno poslovanje. Udeleženci raziskujejo ključne spremembe zakona, oblikujejo učinkovite varnostne procese in spoznavajo, kako v praksi voditi obvladovanje kibernetskih incidentov. 🔒 Če vam danes ni uspelo biti z nami, ne skrbite - imamo dobro novico: prijave za naslednji termin, 6. februar 2026, so že odprte! 👉 Več informacij in prijava:"
