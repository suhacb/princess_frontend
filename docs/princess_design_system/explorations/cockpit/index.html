<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Princess · Cockpit (hi-fi)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<link rel="stylesheet" href="../../styles.css">
<style>
  html, body { height: 100%; margin: 0; }
  body { background: var(--mat-sys-surface); font-family: var(--font-sans); color: var(--mat-sys-on-surface); }
  #root { height: 100vh; }
  * { box-sizing: border-box; }
  .material-icons { user-select: none; }

  /* ── App frame ──────────────────────────────────────── */
  .ck-app { display: flex; height: 100vh; overflow: hidden; }
  .ck-body { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--mat-sys-surface-container-lowest); }
  .ck-mainrow { flex: 1; display: flex; min-height: 0; }
  .ck-content { flex: 1; overflow-y: auto; }

  /* ── Sidebar ────────────────────────────────────────── */
  .ck-sidebar { width: 260px; flex: none; background: var(--brand-sidebar); display: flex; flex-direction: column; overflow: hidden; }
  .ck-sidebar__brand { height: 2px; flex: none; background: var(--brand-gradient); }
  .ck-picker { display: flex; align-items: center; gap: 10px; margin: 12px 12px 6px; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.04); cursor: pointer; text-align: left; transition: background var(--duration-base); }
  .ck-picker:hover { background: rgba(255,255,255,.08); }
  .ck-picker__mark { width: 26px; height: 26px; border-radius: 7px; background: var(--brand-gradient-diagonal); flex: none; }
  .ck-picker__text { flex: 1; min-width: 0; }
  .ck-picker__name { display: block; font-family: var(--font-display); font-size: 12.5px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ck-picker__sub { display: block; font-family: var(--font-display); font-size: 10px; color: rgba(255,255,255,.5); text-transform: uppercase; letter-spacing: .06em; margin-top: 1px; }
  .ck-picker__chev { font-size: 18px; color: rgba(255,255,255,.5); }
  .ck-sidebar__scroll { flex: 1; overflow-y: auto; padding: 6px 0; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.1) transparent; }
  .ck-sidebar__scroll::-webkit-scrollbar { width: 4px; }
  .ck-sidebar__scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 2px; }
  .ck-group { padding: 4px 0; }
  .ck-group__label { display: block; padding: 10px 16px 4px; font-family: var(--font-display); font-size: 9px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.3); }
  .ck-item { display: flex; align-items: center; gap: 10px; height: 36px; margin: 1px 8px; padding: 0 12px; border-radius: 8px; cursor: pointer; color: rgba(255,255,255,.72); text-decoration: none; transition: background var(--duration-base), color var(--duration-base); }
  .ck-item:hover { background: rgba(255,255,255,.05); color: rgba(255,255,255,.92); }
  .ck-item--active { background: rgba(78,185,234,.12); color: var(--brand-sidebar-active); }
  .ck-item__icon { font-size: 18px; width: 18px; opacity: .85; }
  .ck-item--active .ck-item__icon { opacity: 1; color: var(--brand-sidebar-active); }
  .ck-item__label { font-family: var(--font-display); font-size: 12px; letter-spacing: .01em; }
  .ck-sidebar__footer { flex: none; border-top: 1px solid rgba(255,255,255,.06); padding: 4px 0 6px; }

  /* ── Top bar ────────────────────────────────────────── */
  .ck-topbar { display: flex; align-items: center; height: 64px; flex: none; padding: 0 14px; background: var(--mat-sys-surface); border-bottom: 1px solid var(--mat-sys-outline-variant); box-shadow: var(--elevation-1); position: relative; z-index: 20; gap: 8px; }
  .ck-topbar__start { display: flex; align-items: center; gap: 12px; flex: none; }
  .ck-topbar__logo { display: flex; align-items: center; opacity: .9; }
  .ck-switch { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px 0 8px; border-radius: 20px; border: 1px solid var(--mat-sys-outline-variant); background: var(--mat-sys-surface-container); cursor: pointer; transition: border-color var(--duration-base), background var(--duration-base); }
  .ck-switch:hover { border-color: var(--mat-sys-primary); background: var(--mat-sys-surface-container-high); }
  .ck-switch__mark { width: 18px; height: 18px; border-radius: 5px; background: var(--brand-gradient-diagonal); flex: none; }
  .ck-switch__name { font-family: var(--font-display); font-size: 13px; font-weight: 600; color: var(--mat-sys-on-surface); }
  .ck-switch__chev { font-size: 18px; color: var(--text-secondary); }
  .ck-topbar__center { flex: 1; display: flex; justify-content: center; padding: 0 16px; }
  .ck-search { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px 0 10px; min-width: 280px; max-width: 460px; width: 100%; border-radius: 20px; border: 1px solid var(--mat-sys-outline-variant); background: var(--mat-sys-surface-container); color: var(--mat-sys-on-surface-variant); font-family: var(--font-display); font-size: 13px; cursor: pointer; transition: border-color var(--duration-base), background var(--duration-base); }
  .ck-search:hover { border-color: var(--mat-sys-primary); background: var(--mat-sys-surface-container-high); }
  .ck-search__icon { font-size: 16px; opacity: .6; }
  .ck-search__label { flex: 1; text-align: left; }
  .ck-search__kbd { padding: 1px 5px; border-radius: 4px; background: var(--mat-sys-surface-variant); border: 1px solid var(--mat-sys-outline-variant); font-size: 11px; opacity: .7; }
  .ck-topbar__end { display: flex; align-items: center; gap: 8px; flex: none; }
  .ck-rolepick { display: flex; align-items: center; gap: 8px; }
  .ck-rolepick__eyebrow { font-family: var(--font-display); font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-secondary); }
  .ck-rolepick__seg { display: flex; border: 1px solid var(--mat-sys-outline-variant); border-radius: 18px; overflow: hidden; }
  .ck-rolepick__btn { appearance: none; border: none; border-right: 1px solid var(--mat-sys-outline-variant); background: var(--mat-sys-surface-container); padding: 6px 11px; font-family: var(--font-display); font-size: 11.5px; font-weight: 600; color: var(--text-secondary); cursor: pointer; }
  .ck-rolepick__btn:last-child { border-right: none; }
  .ck-rolepick__btn.is-active { background: color-mix(in srgb, var(--mat-sys-primary) 14%, transparent); color: var(--mat-sys-primary); }
  .ck-ask { display: flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 20px; border: 1.5px solid transparent; background: var(--brand-gradient-diagonal); color: #fff; font-family: var(--font-display); font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .ck-ask .material-icons { font-size: 17px; }
  .ck-ask.is-open { background: #fff; color: var(--brand-azure-1); border-color: var(--brand-azure-3); }

  /* ── Page scaffolding ───────────────────────────────── */
  .ck-page { max-width: 1180px; margin: 0 auto; padding: 26px 30px 64px; display: flex; flex-direction: column; gap: 18px; }
  .ck-pagehead { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .ck-pagehead__title { display: flex; align-items: center; gap: 11px; flex-wrap: wrap; }
  .ck-pagehead__title h1 { margin: 0; font-size: 1.6rem; font-weight: 400; letter-spacing: -.01em; }
  .ck-pagehead__actions { display: flex; align-items: center; gap: 10px; }
  .ck-count { font-family: var(--font-display); font-size: .8125rem; color: var(--text-secondary); background: color-mix(in srgb, var(--mat-sys-on-surface) 8%, transparent); padding: 2px 9px; border-radius: 12px; }
  .ck-lede { margin: -8px 0 2px; font-size: .9375rem; color: var(--text-secondary); max-width: 700px; line-height: 1.55; }
  .ck-rolehint { font-family: var(--font-display); font-size: .8125rem; color: var(--text-secondary); }
  .ck-eyebrow { font-family: var(--font-display); font-size: .6875rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--text-secondary); }

  .ck-cols { display: grid; gap: 18px; align-items: start; }
  .ck-cols--2to1 { grid-template-columns: 1.6fr 1fr; }
  .ck-cols--3to2 { grid-template-columns: 1.4fr 1fr; }
  .ck-cols--1to1 { grid-template-columns: 1fr 1fr; }
  .ck-stack { display: flex; flex-direction: column; gap: 18px; }

  /* ── KPIs ───────────────────────────────────────────── */
  .ck-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .ck-kpi { border: 1px solid var(--mat-sys-outline-variant); border-radius: var(--radius-card); background: var(--mat-sys-surface-container-lowest); padding: 14px 16px; }
  .ck-kpi__label { font-family: var(--font-display); font-size: .6875rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-secondary); }
  .ck-kpi__row { display: flex; align-items: baseline; gap: 9px; margin-top: 8px; }
  .ck-kpi__value { font-size: 1.7rem; font-weight: 500; line-height: 1; }
  .ck-kpi__value--ok { color: var(--status-success); } .ck-kpi__value--warn { color: var(--status-warning); }
  .ck-kpi__value--danger { color: var(--status-danger); } .ck-kpi__value--neutral { color: var(--mat-sys-primary); }
  .ck-kpi__sub { font-size: .75rem; color: var(--text-secondary); line-height: 1.3; }

  /* ── Tables ─────────────────────────────────────────── */
  .ck-tablecard { border: 1px solid var(--mat-sys-outline-variant); border-radius: var(--radius-card); overflow: hidden; background: var(--mat-sys-surface-container-lowest); }
  .ck-table { width: 100%; border-collapse: collapse; font-size: .875rem; }
  .ck-table th { text-align: left; padding: 11px 16px; background: var(--mat-sys-surface-container); font-family: var(--font-display); font-size: .7rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-secondary); }
  .ck-table td { padding: 11px 16px; border-top: 1px solid var(--mat-sys-outline-variant); color: var(--text-primary); vertical-align: middle; }
  .ck-table tbody tr { cursor: pointer; transition: background var(--duration-fast); }
  .ck-table tbody tr:hover { background: var(--mat-sys-surface-container-low); }
  .ck-table--flush { font-size: .875rem; }
  .ck-table--flush td { padding: 9px 6px; }
  .ck-table--flush tbody tr:first-child td { border-top: none; }
  .ck-cell-strong { font-weight: 500; }
  .ck-cell-sub { font-size: .76rem; color: var(--text-secondary); margin-top: 2px; }
  .ck-muted { color: var(--text-secondary); }
  .ck-unowned { color: var(--status-warning); font-weight: 500; }
  .ck-cell-action { width: 36px; text-align: right; color: var(--mat-sys-outline); }
  .ck-cell-action .material-icons { font-size: 20px; }
  .ck-ref { font-family: var(--font-mono); font-size: .76rem; background: color-mix(in srgb, var(--mat-sys-on-surface) 8%, transparent); padding: 1px 6px; border-radius: 4px; color: var(--text-secondary); }
  .ck-health { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
  .ck-health--ok { background: var(--status-success); } .ck-health--warn { background: var(--status-warning); } .ck-health--danger { background: var(--status-danger); }

  /* tolerance + relationship chips */
  .ck-tol { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-display); font-size: .75rem; font-weight: 600; padding: 3px 9px; border-radius: 12px; }
  .ck-tol .material-icons { font-size: 14px; }
  .ck-tol--ok { color: var(--status-success); background: color-mix(in srgb, var(--status-success) 12%, transparent); }
  .ck-tol--warn { color: var(--status-warning-strong); background: color-mix(in srgb, var(--status-warning) 16%, transparent); }
  .ck-tol--danger { color: var(--status-danger); background: color-mix(in srgb, var(--status-danger) 12%, transparent); }
  .ck-tol--none { color: var(--text-secondary); background: color-mix(in srgb, var(--mat-sys-on-surface) 6%, transparent); }
  .ck-links { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .ck-link { display: inline-flex; align-items: center; gap: 3px; font-family: var(--font-display); font-size: .72rem; font-weight: 500; padding: 2px 7px; border-radius: 7px; border: 1px solid var(--mat-sys-outline-variant); color: var(--text-secondary); background: var(--mat-sys-surface-container-lowest); }
  .ck-link .material-icons { font-size: 13px; }
  .ck-link--issue { color: var(--status-danger); border-color: color-mix(in srgb, var(--status-danger) 30%, transparent); background: color-mix(in srgb, var(--status-danger) 7%, transparent); }
  .ck-link--change { color: var(--status-warning-strong); border-color: color-mix(in srgb, var(--status-warning) 34%, transparent); background: color-mix(in srgb, var(--status-warning) 9%, transparent); }
  .ck-link--stage { color: var(--mat-sys-primary); border-color: color-mix(in srgb, var(--mat-sys-primary) 30%, transparent); background: color-mix(in srgb, var(--mat-sys-primary) 7%, transparent); }
  .ck-link--doc { color: var(--mat-sys-tertiary); border-color: color-mix(in srgb, var(--mat-sys-tertiary) 30%, transparent); background: color-mix(in srgb, var(--mat-sys-tertiary) 8%, transparent); }
  .ck-link--risk { color: var(--mat-sys-primary); border-color: var(--mat-sys-outline-variant); }

  /* ── Cards content helpers ──────────────────────────── */
  .ck-cardnote { margin: 0; font-size: .875rem; line-height: 1.55; color: var(--text-secondary); }
  .ck-metarow { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 12px; }
  .ck-meta { font-size: .82rem; color: var(--text-primary); }
  .ck-meta b { font-family: var(--font-display); font-weight: 600; font-size: .68rem; letter-spacing: .06em; text-transform: uppercase; color: var(--text-secondary); margin-right: 6px; }
  .ck-btnrow { display: flex; gap: 10px; margin-top: 12px; }
  .ck-check { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
  .ck-check li { display: flex; align-items: center; gap: 9px; font-size: .875rem; }
  .ck-check li .material-icons { font-size: 18px; }
  .ck-check li.is-ok .material-icons { color: var(--status-success); }
  .ck-check li.is-warn { color: var(--status-warning-strong); } .ck-check li.is-warn .material-icons { color: var(--status-warning); }
  .ck-check li.is-todo .material-icons { color: var(--mat-sys-outline); }
  .ck-wphead { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

  /* tolerance bars */
  .ck-tolrow { margin-bottom: 13px; } .ck-tolrow:last-child { margin-bottom: 0; }
  .ck-tolrow__top { display: flex; justify-content: space-between; font-size: .8125rem; color: var(--text-secondary); margin-bottom: 5px; }
  .ck-tolrow__used { font-weight: 600; } .ck-tolrow__used--ok { color: var(--status-success); } .ck-tolrow__used--warn { color: var(--status-warning-strong); }
  .ck-tolbar { height: 8px; border-radius: 5px; background: var(--mat-sys-surface-container-high); overflow: hidden; }
  .ck-tolbar i { display: block; height: 100%; border-radius: 5px; }
  .ck-tolbar--ok { background: var(--status-success); } .ck-tolbar--warn { background: var(--status-warning); } .ck-tolbar--danger { background: var(--status-danger); }

  /* work packages */
  .ck-wplist { display: flex; flex-direction: column; gap: 12px; }
  .ck-wp { display: flex; align-items: center; gap: 11px; }
  .ck-wp__main { flex: 1; min-width: 0; }

  /* gantt */
  .ck-gantt { display: flex; flex-direction: column; gap: 9px; }
  .ck-grow { display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 12px; }
  .ck-grow__label { font-size: .8125rem; color: var(--text-secondary); }
  .ck-gtrack { height: 18px; border-radius: 6px; background: var(--mat-sys-surface-container-high); position: relative; }
  .ck-gbar { position: absolute; top: 0; bottom: 0; border-radius: 6px; background: color-mix(in srgb, var(--mat-sys-primary) 35%, transparent); }
  .ck-gbar.is-on { background: color-mix(in srgb, var(--mat-sys-primary) 60%, transparent); }

  /* relationship map */
  .ck-relmap { display: flex; align-items: stretch; gap: 0; margin: 4px 0; }
  .ck-relnode { flex: 1; border: 1.5px solid var(--mat-sys-outline-variant); border-radius: 10px; padding: 11px; text-align: center; background: var(--mat-sys-surface-container-lowest); }
  .ck-relnode.is-focus { border-color: var(--mat-sys-primary); background: color-mix(in srgb, var(--mat-sys-primary) 8%, transparent); }
  .ck-relnode.is-doc { border-color: color-mix(in srgb, var(--mat-sys-tertiary) 40%, transparent); background: color-mix(in srgb, var(--mat-sys-tertiary) 8%, transparent); }
  .ck-relnode__kind { font-family: var(--font-display); font-size: .62rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-secondary); }
  .ck-relnode__ref { font-family: var(--font-mono); font-size: .82rem; font-weight: 500; margin-top: 3px; }
  .ck-relarrow { align-self: center; color: var(--text-secondary); font-size: 18px; padding: 0 6px; }
  .ck-relfoot { margin-top: 11px; font-size: .8rem; color: var(--text-secondary); display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }

  /* documents */
  .ck-docs { display: flex; flex-direction: column; gap: 11px; }
  .ck-doc { display: flex; align-items: center; gap: 10px; }
  .ck-doc__ic { width: 30px; height: 30px; border-radius: 7px; display: flex; align-items: center; justify-content: center; flex: none; background: color-mix(in srgb, var(--mat-sys-tertiary) 14%, transparent); color: var(--mat-sys-tertiary); }
  .ck-doc__ic .material-icons { font-size: 17px; }

  .ck-back { display: inline-flex; align-items: center; gap: 4px; align-self: flex-start; background: none; border: none; cursor: pointer; color: var(--text-secondary); font-family: var(--font-display); font-size: .8125rem; padding: 0; }
  .ck-back:hover { color: var(--mat-sys-primary); }
  .ck-back .material-icons { font-size: 18px; }
  .ck-detailhead__row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .ck-detailhead__title h1 { margin: 4px 0 0; font-size: 1.6rem; font-weight: 400; }
  .ck-detailhead__meta { display: flex; align-items: center; gap: 10px; }

  .ck-filters { display: flex; align-items: center; gap: 12px; }
  .ck-segment { display: flex; border: 1px solid var(--mat-sys-outline-variant); border-radius: 20px; overflow: hidden; font-family: var(--font-display); }
  .ck-segment button { appearance: none; border: none; background: transparent; padding: 7px 15px; font-size: .8rem; font-weight: 500; color: var(--text-secondary); cursor: pointer; }
  .ck-segment button.is-active { background: color-mix(in srgb, var(--mat-sys-primary) 12%, transparent); color: var(--mat-sys-primary); }

  /* ── AI dock ────────────────────────────────────────── */
  .ck-dock { width: 344px; flex: none; border-left: 1px solid var(--mat-sys-outline-variant); background: var(--mat-sys-surface-container-low); display: flex; flex-direction: column; min-height: 0; }
  .ck-dock__head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 8px; }
  .ck-dock__title { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 600; font-size: 14px; color: var(--brand-azure-1); }
  .ck-dock__mark, .ck-aicard__mark { width: 20px; height: 20px; border-radius: 6px; background: var(--brand-gradient-diagonal); flex: none; }
  .ck-dock__close { background: none; border: none; cursor: pointer; color: var(--text-secondary); font-size: 20px; }
  .ck-dock__ctx { display: flex; align-items: center; gap: 6px; margin: 0 16px 10px; padding: 6px 10px; border-radius: 8px; background: color-mix(in srgb, var(--mat-sys-primary) 7%, transparent); font-family: var(--font-display); font-size: 11.5px; color: var(--mat-sys-primary); }
  .ck-dock__ctx .material-icons { font-size: 14px; }
  .ck-dock__tabs { display: flex; gap: 3px; padding: 0 12px 8px; }
  .ck-dock__tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 2px; border: none; background: none; border-radius: 8px; cursor: pointer; font-family: var(--font-display); font-size: 9.5px; font-weight: 600; letter-spacing: .02em; color: var(--text-secondary); }
  .ck-dock__tab .material-icons { font-size: 17px; }
  .ck-dock__tab.is-active { background: color-mix(in srgb, var(--brand-azure-3) 16%, transparent); color: var(--brand-azure-1); }
  .ck-dock__scroll { flex: 1; overflow-y: auto; padding: 6px 14px 12px; display: flex; flex-direction: column; gap: 10px; }
  .ck-aicard { border: 1px solid color-mix(in srgb, var(--brand-azure-3) 40%, var(--mat-sys-outline-variant)); border-left: 3px solid var(--brand-azure-2); border-radius: 10px; background: var(--mat-sys-surface-container-lowest); padding: 11px 12px; }
  .ck-aicard__head { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; }
  .ck-aicard__mark { width: 17px; height: 17px; border-radius: 5px; }
  .ck-aicard__eyebrow { font-family: var(--font-display); font-size: .64rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--brand-azure-1); }
  .ck-aicard__body { font-size: .82rem; line-height: 1.5; color: var(--text-primary); }
  .ck-aicard__actions { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
  .ck-steps { margin: 9px 0 0; padding: 0; list-style: none; counter-reset: s; }
  .ck-steps li { position: relative; padding: 5px 0 5px 25px; font-size: .8rem; line-height: 1.4; color: var(--text-primary); }
  .ck-steps li::before { counter-increment: s; content: counter(s); position: absolute; left: 0; top: 4px; width: 17px; height: 17px; border-radius: 50%; background: color-mix(in srgb, var(--brand-azure-3) 18%, transparent); color: var(--brand-azure-1); font-family: var(--font-display); font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .ck-chat { display: flex; flex-direction: column; gap: 9px; }
  .ck-bubble { border-radius: 12px; padding: 9px 12px; font-size: .82rem; line-height: 1.45; max-width: 88%; }
  .ck-bubble--me { background: color-mix(in srgb, var(--mat-sys-primary) 14%, transparent); color: var(--mat-sys-primary); align-self: flex-end; border-bottom-right-radius: 4px; }
  .ck-bubble--ai { background: var(--mat-sys-surface-container-lowest); border: 1px solid color-mix(in srgb, var(--brand-azure-3) 35%, var(--mat-sys-outline-variant)); color: var(--text-primary); border-bottom-left-radius: 4px; }
  .ck-chat__suggest { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
  .ck-suggchip { text-align: left; border: 1px solid color-mix(in srgb, var(--brand-azure-3) 40%, transparent); background: none; color: var(--brand-azure-1); font-family: var(--font-display); font-size: .76rem; font-weight: 500; padding: 7px 10px; border-radius: 8px; cursor: pointer; }
  .ck-suggchip:hover { background: color-mix(in srgb, var(--brand-azure-3) 10%, transparent); }
  .ck-dock__ask { display: flex; align-items: center; gap: 8px; margin: 0 12px 12px; padding: 7px 8px 7px 11px; border: 1.5px solid color-mix(in srgb, var(--brand-azure-3) 45%, var(--mat-sys-outline-variant)); border-radius: 22px; background: var(--mat-sys-surface-container-lowest); }
  .ck-dock__input { flex: 1; border: none; background: none; outline: none; font-family: var(--font-sans); font-size: .82rem; color: var(--text-primary); }
  .ck-dock__send { border: none; background: var(--brand-gradient-diagonal); color: #fff; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
  .ck-dock__toast { display: flex; align-items: center; gap: 7px; margin: 0 14px 10px; padding: 9px 12px; border-radius: 9px; background: color-mix(in srgb, var(--status-success) 14%, transparent); color: var(--status-success-strong); font-size: .8rem; }
  .ck-dock__toast .material-icons { font-size: 17px; }

  /* ── Overlays ───────────────────────────────────────── */
  .ck-overlay { position: fixed; inset: 0; z-index: 60; background: color-mix(in srgb, #1a1b21 26%, transparent); }
  .ck-overlay--switch { } 
  .ck-switchpanel { position: absolute; left: 14px; top: 60px; width: 320px; background: var(--mat-sys-surface-container-lowest); border: 1px solid var(--mat-sys-outline-variant); border-radius: 12px; box-shadow: var(--elevation-3); overflow: hidden; }
  .ck-switchpanel__head { padding: 11px 14px 6px; }
  .ck-switchpanel__list { padding: 4px; max-height: 340px; overflow-y: auto; }
  .ck-switchrow { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: none; background: none; border-radius: 9px; cursor: pointer; text-align: left; }
  .ck-switchrow:hover { background: var(--mat-sys-surface-container-low); }
  .ck-switchrow.is-active { background: color-mix(in srgb, var(--mat-sys-primary) 8%, transparent); }
  .ck-switchrow__main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .ck-switchpanel__foot { display: flex; gap: 6px; padding: 7px; border-top: 1px solid var(--mat-sys-outline-variant); }
  .ck-textbtn { display: inline-flex; align-items: center; gap: 6px; border: none; background: none; cursor: pointer; font-family: var(--font-display); font-size: .8rem; font-weight: 500; color: var(--mat-sys-primary); padding: 6px 9px; border-radius: 8px; }
  .ck-textbtn:hover { background: color-mix(in srgb, var(--mat-sys-primary) 8%, transparent); }
  .ck-textbtn .material-icons { font-size: 17px; }

  .ck-overlay--palette { display: flex; align-items: flex-start; justify-content: center; padding-top: 96px; }
  .ck-palette { width: 560px; max-width: 92vw; background: var(--mat-sys-surface-container-lowest); border: 1px solid var(--mat-sys-outline-variant); border-radius: 14px; box-shadow: var(--elevation-3); overflow: hidden; }
  .ck-palette__q { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--mat-sys-outline-variant); }
  .ck-palette__q .material-icons { color: var(--text-secondary); }
  .ck-palette__typed { font-size: 15px; color: var(--text-primary); }
  .ck-palette__caret { width: 1.5px; height: 17px; background: var(--mat-sys-primary); animation: ckblink 1s step-end infinite; }
  .ck-palette__q .ck-search__kbd { margin-left: auto; }
  @keyframes ckblink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .ck-palette__caret { animation: none; } }
  .ck-palette__scroll { padding: 7px; max-height: 60vh; overflow-y: auto; }
  .ck-palette__group { font-family: var(--font-display); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-secondary); font-weight: 600; padding: 9px 10px 4px; }
  .ck-prow { display: flex; align-items: center; gap: 11px; width: 100%; padding: 9px 10px; border: none; background: none; border-radius: 9px; cursor: pointer; text-align: left; font-size: .875rem; color: var(--text-primary); }
  .ck-prow:hover, .ck-prow.is-active { background: color-mix(in srgb, var(--mat-sys-primary) 9%, transparent); }
  .ck-prow > span:nth-child(2) { flex: 1; }
  .ck-prow__meta { font-family: var(--font-display); font-size: .72rem; color: var(--text-secondary); }
  .ck-prow .ck-link { width: 26px; height: 26px; justify-content: center; padding: 0; }
  .ck-prow--ai span:nth-child(2) { color: var(--brand-azure-1); }

  @media (max-width: 1180px) {
    .ck-cols--2to1, .ck-cols--3to2, .ck-cols--1to1 { grid-template-columns: 1fr; }
    .ck-kpis { grid-template-columns: repeat(2, 1fr); }
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="AIDock.jsx"></script>
<script type="text/babel" src="Portfolio.jsx"></script>
<script type="text/babel" src="Home.jsx"></script>
<script type="text/babel" src="RiskScreens.jsx"></script>
<script type="text/babel" src="Stages.jsx"></script>
<script type="text/babel" src="Overlays.jsx"></script>
</head>
<body>
<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" rx="14" fill="#0d1520"/>
    <rect x="22" y="30" width="30" height="3" rx="1.5" fill="url(#g)"/>
    <rect x="22" y="40" width="56" height="30" rx="4" fill="#1c2738"/>
    <rect x="60" y="40" width="18" height="30" rx="4" fill="#2a3b56"/>
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4561a2"/><stop offset="1" stop-color="#4eb9ea"/></linearGradient></defs>
  </svg>
</template>
<div id="root"></div>

<script type="text/babel" data-presets="react">
  const { useState, useEffect } = React;

  function Placeholder({ label }) {
    return (
      <div className="ck-page"><div style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:8, padding:'80px', color:'var(--text-secondary)', textAlign:'center' }}>
        <span className="material-icons" style={{ fontSize:44, opacity:.35 }}>construction</span>
        <h2 style={{ margin:'6px 0 0', fontWeight:500, color:'var(--text-primary)' }}>{label}</h2>
        <p style={{ maxWidth:380 }}>This destination is part of the Cockpit map. The hi-fi pass details Project Home, Risk Log, an item detail, Plan &amp; stages, the portfolio and the AI dock.</p>
      </div></div>
    );
  }

  function App() {
    const D = window.COCKPIT;
    const [route, setRoute] = useState('portfolio');   // start at the portfolio (no project context yet)
    const [project, setProject] = useState(D.project);
    const [role, setRole] = useState('pm');
    const [item, setItem] = useState(null);
    const [aiOpen, setAiOpen] = useState(false);
    const [switchOpen, setSwitchOpen] = useState(false);
    const [paletteOpen, setPaletteOpen] = useState(false);

    useEffect(() => {
      function onKey(e) {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); setPaletteOpen(true); }
        if (e.key === 'Escape') { setPaletteOpen(false); setSwitchOpen(false); }
      }
      window.addEventListener('keydown', onKey);
      return () => window.removeEventListener('keydown', onKey);
    }, []);

    // keep role-restricted users off hidden routes
    useEffect(() => {
      const blocked = { tm: ['stages', 'changes', 'quality', 'lessons', 'highlight', 'exceptions'] };
      if ((blocked[role] || []).indexOf(route) !== -1) setRoute('home');
    }, [role]);

    function navigate(key) { setItem(null); setRoute(key); }
    function openProject(p) { setProject(p.active ? D.project : { ...D.project, name: p.name, reference: p.reference, stage: p.stage }); setRoute('home'); setSwitchOpen(false); }
    function openItem(it) { setItem(it); setRoute('item'); setPaletteOpen(false); }
    const ctx = { route, item };

    let screen;
    if (route === 'portfolio') screen = <window.CkPortfolio onOpenProject={openProject} />;
    else if (route === 'home') screen = <window.CkHome role={role} project={project} onOpenItem={openItem} onNavigate={navigate} onAsk={() => setAiOpen(true)} />;
    else if (route === 'risks') screen = <window.CkRiskLog onOpenItem={openItem} />;
    else if (route === 'item') screen = <window.CkItemDetail item={item} onBack={() => navigate('risks')} onAsk={() => setAiOpen(true)} />;
    else if (route === 'stages') screen = <window.CkStages project={project} onAsk={() => setAiOpen(true)} />;
    else {
      const labels = { issues:'Issue Log', changes:'Change Log', quality:'Quality Register', lessons:'Lessons Log', highlight:'Highlight Reports', exceptions:'Exception Reports', docs:'Document Library' };
      screen = <Placeholder label={labels[route] || 'Coming soon'} />;
    }

    const activeKey = route === 'item' ? 'risks' : route;

    return (
      <div className="ck-app">
        {route !== 'portfolio'
          ? <window.CkSidebar active={activeKey} role={role} project={project} onNavigate={navigate} onOpenSwitcher={() => setSwitchOpen(true)} />
          : <PortfolioRail onClose={() => {}} />}
        <div className="ck-body">
          <window.CkTopBar project={project} role={role} roles={D.roles}
            onOpenSwitcher={() => setSwitchOpen(true)} onRole={setRole}
            onSearch={() => setPaletteOpen(true)} onAsk={() => setAiOpen((v) => !v)} aiOpen={aiOpen} />
          <div className="ck-mainrow">
            <div className="ck-content">{screen}</div>
            {aiOpen && <window.CkAIDock ctx={ctx} onClose={() => setAiOpen(false)} />}
          </div>
        </div>
        {switchOpen && <window.CkSwitcher onClose={() => setSwitchOpen(false)} onPick={openProject} onPortfolio={() => { setRoute('portfolio'); setSwitchOpen(false); }} />}
        {paletteOpen && <window.CkPalette onClose={() => setPaletteOpen(false)} onOpenItem={openItem} onNavigate={(k) => { navigate(k); setPaletteOpen(false); }} onAsk={() => { setPaletteOpen(false); setAiOpen(true); }} />}
      </div>
    );
  }

  // Portfolio uses a lightweight account-level rail instead of the project rail.
  function PortfolioRail() {
    return (
      <nav className="ck-sidebar">
        <div className="ck-sidebar__brand" />
        <div style={{ display:'flex', alignItems:'center', gap:10, margin:'14px 14px 6px' }}>
          <img src="../../assets/logo.svg" alt="Princess" height="22" style={{ filter:'brightness(0) invert(1)', opacity:.92 }} />
        </div>
        <div className="ck-sidebar__scroll">
          <div className="ck-group">
            <span className="ck-group__label">Portfolio</span>
            <a className="ck-item ck-item--active"><span className="material-icons ck-item__icon">apps</span><span className="ck-item__label">All projects</span></a>
            <a className="ck-item"><span className="material-icons ck-item__icon">person</span><span className="ck-item__label">My projects</span></a>
            <a className="ck-item"><span className="material-icons ck-item__icon">content_copy</span><span className="ck-item__label">Templates</span></a>
            <a className="ck-item"><span className="material-icons ck-item__icon">inventory_2</span><span className="ck-item__label">Archive</span></a>
          </div>
          <div className="ck-group">
            <span className="ck-group__label">Account</span>
            <a className="ck-item"><span className="material-icons ck-item__icon">group</span><span className="ck-item__label">People & roles</span></a>
          </div>
        </div>
      </nav>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
