<!-- @dsCard group="Components" viewport="700x300" name="Display" subtitle="Cards, badges, chips & avatars" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 22px; background: var(--mat-sys-surface); }
  .wrap { display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  dl { margin: 0; display: grid; grid-template-columns: 90px 1fr; gap: 6px 12px; font-size: .8125rem; }
  dt { color: var(--text-secondary); }
  dd { margin: 0; color: var(--text-primary); }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Card, Badge, Chip, Avatar } = window.PrincessDesignSystem_3d336d;
  function Demo() {
    return (
      <div className="wrap">
        <div className="row">
          <Badge tone="primary">12 risks</Badge>
          <Badge tone="success" icon="check_circle">Mitigated</Badge>
          <Badge tone="warning">Near</Badge>
          <Badge tone="danger" solid>Overdue</Badge>
          <Badge tone="tertiary">Closing</Badge>
        </div>
        <div className="row">
          <Chip icon="filter_list" selected>Open</Chip>
          <Chip>Delivery</Chip>
          <Chip icon="person" onRemove={() => {}}>A. Novak</Chip>
          <Avatar name="Ada Lovelace" />
          <Avatar name="Grace Hopper" size="sm" />
          <Avatar name="Tim Berners-Lee" size="lg" />
        </div>
        <div className="cards">
          <Card title="Project details">
            <dl><dt>Reference</dt><dd>PROJ-001</dd><dt>Stage</dt><dd>Delivery</dd><dt>Owner</dt><dd>A. Novak</dd></dl>
          </Card>
          <Card variant="outlined" title="Tolerances">
            <dl><dt>Time</dt><dd>-5 / +10 days</dd><dt>Cost</dt><dd>5 000 €</dd><dt>Quality</dt><dd>ISO 9001</dd></dl>
          </Card>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body></html>
