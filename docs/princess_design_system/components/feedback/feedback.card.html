<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 22px; background: var(--mat-sys-surface); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  .panel { background: var(--mat-sys-surface-container-lowest); border: 1px solid var(--border-subtle); border-radius: var(--radius-card); overflow: hidden; }
  .skel { display: flex; flex-direction: column; gap: 8px; padding: 16px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { EmptyState, Skeleton, Tabs } = window.PrincessDesignSystem_3d336d;
  function Demo() {
    return (
      <div>
        <Tabs tabs={['Overview','Risks','Issues','Quality','Documents']} defaultValue="Risks" style={{marginBottom:'18px'}} />
        <div className="grid">
          <div className="panel">
            <EmptyState icon="folder_open" title="No projects found"
              message="Create your first PRINCE2 project to get started." actionLabel="New project" />
          </div>
          <div className="panel">
            <div className="skel">
              <Skeleton height="20px" width="60%" />
              <Skeleton height="44px" />
              <Skeleton height="44px" />
              <Skeleton height="44px" width="80%" />
            </div>
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body></html>
