<!-- @dsCard group="Type" viewport="700x190" name="Font families" subtitle="Roboto for data & body · Instrument Sans for UI chrome" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px; }
  .fam { padding: 14px 0; border-bottom: 1px solid var(--border-subtle); }
  .fam:last-child { border: none; }
  .tag { font-family: var(--font-display); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-secondary); }
  .specimen { font-size: 26px; color: var(--text-primary); margin-top: 4px; }
  .use { font-family: var(--font-display); font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
</style></head>
<body>
  <div class="fam">
    <div class="tag">Roboto</div>
    <div class="specimen" style="font-family:'Roboto',sans-serif;font-weight:400">Project tolerances exceeded by 3 days</div>
    <div class="use">Body, tables, dense data · 300 / 400 / 500 / 700</div>
  </div>
  <div class="fam">
    <div class="tag">Instrument Sans</div>
    <div class="specimen" style="font-family:'Instrument Sans',sans-serif;font-weight:600">Raise Risk · Highlight Report</div>
    <div class="use">UI chrome, labels, nav, headings · 400 / 500 / 600 / 700</div>
  </div>
</body></html>
