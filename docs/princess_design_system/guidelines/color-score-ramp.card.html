<!-- @dsCard group="Colors" viewport="700x140" name="Risk score ramp" subtitle="Severity ramp for probability × impact (1–25) badges" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; font-family: var(--font-display); }
  .ramp { display: flex; gap: 18px; align-items: center; }
  .lvl { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .badge { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
  .name { font-size: 11px; color: var(--text-secondary); }
  .rng { font-family: var(--font-mono); font-size: 10px; color: var(--text-secondary); }
</style></head>
<body>
  <div class="ramp">
    <div class="lvl"><span class="badge" style="background:color-mix(in srgb,#2e7d32 15%,transparent);color:#2e7d32">3</span><span class="name">Low</span><span class="rng">1–4</span></div>
    <div class="lvl"><span class="badge" style="background:color-mix(in srgb,#f9a825 15%,transparent);color:#f57f17">8</span><span class="name">Medium</span><span class="rng">5–9</span></div>
    <div class="lvl"><span class="badge" style="background:color-mix(in srgb,#e65100 15%,transparent);color:#e65100">12</span><span class="name">High</span><span class="rng">10–15</span></div>
    <div class="lvl"><span class="badge" style="background:color-mix(in srgb,#ba1a1a 15%,transparent);color:#ba1a1a">20</span><span class="name">Critical</span><span class="rng">16–25</span></div>
  </div>
</body></html>
