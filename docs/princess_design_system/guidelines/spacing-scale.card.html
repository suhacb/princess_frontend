<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="Base-4 · 24px page padding, 16–20px card gaps" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px; font-family: var(--font-display); }
  .row { display: flex; align-items: flex-end; gap: 16px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { background: color-mix(in srgb, var(--mat-sys-primary) 22%, transparent); border-left: 2px solid var(--mat-sys-primary); height: 48px; }
  .v { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); }
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="bar" style="width:4px"></div><span class="v">4</span></div>
    <div class="item"><div class="bar" style="width:8px"></div><span class="v">8</span></div>
    <div class="item"><div class="bar" style="width:12px"></div><span class="v">12</span></div>
    <div class="item"><div class="bar" style="width:16px"></div><span class="v">16</span></div>
    <div class="item"><div class="bar" style="width:20px"></div><span class="v">20</span></div>
    <div class="item"><div class="bar" style="width:24px"></div><span class="v">24</span></div>
    <div class="item"><div class="bar" style="width:32px"></div><span class="v">32</span></div>
    <div class="item"><div class="bar" style="width:48px"></div><span class="v">48</span></div>
  </div>
</body></html>
