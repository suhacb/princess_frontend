<!-- @dsCard group="Colors" viewport="700x180" name="Primary (azure)" subtitle="Material 3 primary role tokens — buttons, links, active states" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; font-family: var(--font-display); }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .chip { border-radius: 10px; overflow: hidden; border: 1px solid var(--border-subtle); }
  .fill { height: 56px; display: flex; align-items: flex-end; padding: 8px; }
  .meta { padding: 8px 10px; background: var(--surface-card); }
  .name { font-size: 12px; font-weight: 600; color: var(--text-primary); }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); }
</style></head>
<body>
  <div class="row">
    <div class="chip"><div class="fill" style="background:#475d92"></div><div class="meta"><div class="name">primary</div><div class="hex">#475D92</div></div></div>
    <div class="chip"><div class="fill" style="background:#d8e2ff"></div><div class="meta"><div class="name">primary-container</div><div class="hex">#D8E2FF</div></div></div>
    <div class="chip"><div class="fill" style="background:#2e4578"></div><div class="meta"><div class="name">on-primary-container</div><div class="hex">#2E4578</div></div></div>
    <div class="chip"><div class="fill" style="background:#b0c6ff"></div><div class="meta"><div class="name">inverse-primary</div><div class="hex">#B0C6FF</div></div></div>
  </div>
</body></html>
