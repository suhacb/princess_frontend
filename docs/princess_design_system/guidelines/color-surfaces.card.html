<!-- @dsCard group="Colors" viewport="700x180" name="Surfaces & neutrals" subtitle="Cool-neutral container ramp — the canvas of every screen" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; font-family: var(--font-display); background: var(--mat-sys-surface); }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .chip { border-radius: 10px; overflow: hidden; border: 1px solid var(--border-subtle); }
  .fill { height: 52px; }
  .meta { padding: 7px 9px; background: #fff; }
  .name { font-size: 11px; font-weight: 600; color: var(--text-primary); }
  .hex { font-family: var(--font-mono); font-size: 10px; color: var(--text-secondary); }
</style></head>
<body>
  <div class="row">
    <div class="chip"><div class="fill" style="background:#ffffff"></div><div class="meta"><div class="name">lowest / card</div><div class="hex">#FFFFFF</div></div></div>
    <div class="chip"><div class="fill" style="background:#f4f3fa"></div><div class="meta"><div class="name">container-low</div><div class="hex">#F4F3FA</div></div></div>
    <div class="chip"><div class="fill" style="background:#eeedf4"></div><div class="meta"><div class="name">container</div><div class="hex">#EEEDF4</div></div></div>
    <div class="chip"><div class="fill" style="background:#e8e7ef"></div><div class="meta"><div class="name">container-high</div><div class="hex">#E8E7EF</div></div></div>
    <div class="chip"><div class="fill" style="background:#e2e2e9"></div><div class="meta"><div class="name">highest</div><div class="hex">#E2E2E9</div></div></div>
  </div>
</body></html>
