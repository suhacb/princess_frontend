<!-- @dsCard group="Colors" viewport="700x150" name="Brand gradient" subtitle="Sinecon azure swoosh — 4-stop, used for logo, accents, avatars" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; font-family: var(--font-display); }
  .grad { height: 64px; border-radius: var(--radius-card); background: var(--brand-gradient); }
  .stops { display: flex; gap: 12px; margin-top: 14px; }
  .stop { flex: 1; }
  .sw { height: 28px; border-radius: 6px; border: 1px solid var(--border-subtle); }
  .hex { font-family: var(--font-mono); font-size: 12px; color: var(--text-secondary); margin-top: 6px; display: block; }
  .lbl { font-size: 11px; color: var(--text-secondary); margin-top: 2px; display: block; }
</style></head>
<body>
  <div class="grad"></div>
  <div class="stops">
    <div class="stop"><div class="sw" style="background:#4561a2"></div><span class="hex">#4561A2</span><span class="lbl">azure-1 · start</span></div>
    <div class="stop"><div class="sw" style="background:#4978b3"></div><span class="hex">#4978B3</span><span class="lbl">azure-2</span></div>
    <div class="stop"><div class="sw" style="background:#4da6d8"></div><span class="hex">#4DA6D8</span><span class="lbl">azure-3</span></div>
    <div class="stop"><div class="sw" style="background:#4eb9ea"></div><span class="hex">#4EB9EA</span><span class="lbl">azure-4 · end</span></div>
  </div>
</body></html>
