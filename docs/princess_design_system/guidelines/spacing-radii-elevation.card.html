<!-- @dsCard group="Spacing" viewport="700x170" name="Radii & elevation" subtitle="12px cards · 8px chips · tonal surfaces, shadow only when floating" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px; font-family: var(--font-display); display: flex; gap: 28px; align-items: center; }
  .group { display: flex; gap: 16px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 7px; }
  .box { width: 56px; height: 56px; background: #fff; border: 1px solid var(--border-subtle); }
  .v { font-family: var(--font-mono); font-size: 10px; color: var(--text-secondary); }
  .sep { width: 1px; align-self: stretch; background: var(--border-subtle); }
</style></head>
<body>
  <div class="group">
    <div class="item"><div class="box" style="border-radius:4px"></div><span class="v">4 · sm</span></div>
    <div class="item"><div class="box" style="border-radius:8px"></div><span class="v">8 · chip</span></div>
    <div class="item"><div class="box" style="border-radius:12px"></div><span class="v">12 · card</span></div>
    <div class="item"><div class="box" style="border-radius:9999px"></div><span class="v">full</span></div>
  </div>
  <div class="sep"></div>
  <div class="group">
    <div class="item"><div class="box" style="box-shadow:var(--elevation-1);border-color:transparent"></div><span class="v">e1 · bar</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--elevation-2);border-color:transparent"></div><span class="v">e2 · menu</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--elevation-3);border-color:transparent"></div><span class="v">e3 · dialog</span></div>
  </div>
</body></html>
